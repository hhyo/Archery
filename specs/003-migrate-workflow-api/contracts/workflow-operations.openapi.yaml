openapi: 3.0.3
info:
  title: Workflow Operations API
  version: 1.0.0
  description: >-
    Session-authenticated replacement for the legacy SQL workflow operation views.
    All paths are mounted below /api. Legacy operation URLs are removed.
paths:
  /api/v1/workflows/:
    post:
      summary: List SQL workflows
      operationId: listWorkflows
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/WorkflowListRequest'}
      responses:
        '200': {description: Bootstrap Table compatible list, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowListResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/workflows/audit-list/:
    post:
      summary: List workflows visible to audit users
      operationId: listAuditWorkflows
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/WorkflowListRequest'}
      responses:
        '200': {description: Bootstrap Table compatible list, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowListResponse'}}}}
  /api/v1/workflows/{workflow_id}/content/:
    get:
      summary: Get review or execution content
      operationId: getWorkflowContent
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses:
        '200': {description: Compatible result rows, content: {application/json: {schema: {$ref: '#/components/schemas/RowsResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workflows/{workflow_id}/rollback/:
    get:
      summary: Get rollback SQL
      operationId: getWorkflowRollback
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses:
        '200': {description: Compatible rollback result, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRowsResponse'}}}}
  /api/v1/workflows/{workflow_id}/execution-window/:
    patch:
      summary: Update allowed execution window
      operationId: updateExecutionWindow
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/ExecutionWindow'}
      responses: {'200': {$ref: '#/components/responses/MutationSuccess'}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/approval/:
    post:
      summary: Approve a workflow
      operationId: approveWorkflow
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {audit_remark: {type: string}}, required: [audit_remark]}}}
      responses: {'200': {$ref: '#/components/responses/MutationSuccess'}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/execution/:
    post:
      summary: Queue automatic execution or confirm manual execution
      operationId: executeWorkflow
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {mode: {type: string, enum: [auto, manual]}}, required: [mode]}}}
      responses: {'200': {$ref: '#/components/responses/MutationSuccess'}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/schedule/:
    post:
      summary: Create or replace a scheduled execution
      operationId: scheduleWorkflow
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {run_date: {type: string, format: date-time}}, required: [run_date]}}}
      responses: {'200': {$ref: '#/components/responses/MutationSuccess'}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/termination/:
    post:
      summary: Abort as submitter or reject as reviewer
      operationId: terminateWorkflow
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {cancel_remark: {type: string, minLength: 1}}, required: [cancel_remark]}}}
      responses: {'200': {$ref: '#/components/responses/MutationSuccess'}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/status/:
    get:
      summary: Get current workflow status
      operationId: getWorkflowStatus
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses: {'200': {description: Compatible status response, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/workflows/{workflow_id}/osc/:
    post:
      summary: Control online schema change execution
      operationId: controlWorkflowOsc
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {sqlsha1: {type: string}, command: {type: string}}, required: [sqlsha1, command]}}}
      responses: {'200': {description: Compatible OSC response, content: {application/json: {schema: {$ref: '#/components/schemas/OscResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
components:
  parameters:
    WorkflowId: {name: workflow_id, in: path, required: true, schema: {type: integer, minimum: 1}}
  requestBodies:
    ExecutionWindow:
      required: true
      content: {application/json: {schema: {type: object, properties: {run_date_start: {type: string, nullable: true}, run_date_end: {type: string, nullable: true}}}}}
  responses:
    MutationSuccess: {description: Operation completed, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResponse'}}}}
    ValidationError: {description: Invalid request or disallowed state transition}
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Permission denied}
    NotFound: {description: Workflow not found}
  schemas:
    WorkflowListRequest:
      type: object
      properties: {syntax_type: {type: array, items: {type: integer}}, navStatus: {type: string}, instance_id: {type: integer}, group_id: {type: integer}, start_date: {type: string, format: date}, end_date: {type: string, format: date}, limit: {type: integer}, offset: {type: integer}, search: {type: string}}
    WorkflowListResponse: {type: object, required: [total, rows], properties: {total: {type: integer}, rows: {type: array, items: {type: object}}}}
    RowsResponse: {type: object, required: [rows], properties: {rows: {type: array, items: {type: object}}}}
    OperationRowsResponse: {type: object, required: [status, msg, rows], properties: {status: {type: integer}, msg: {type: string}, rows: {type: array, items: {type: object}}}}
    StatusResponse: {type: object, required: [status, msg, data], properties: {status: {type: string}, msg: {type: string}, data: {type: string}}}
    OscResponse: {type: object, required: [total, rows, msg], properties: {total: {type: integer}, rows: {type: array, items: {type: object}}, msg: {type: string}}}
    MutationResponse: {type: object, required: [status, msg, data], properties: {status: {type: integer, example: 0}, msg: {type: string}, data: {type: object, required: [workflow_id, redirect_url], properties: {workflow_id: {type: integer}, redirect_url: {type: string}}}}}