name: Validate Docker image

# Stage 1 publishes the base separately. Restore application publishing when
# the follow-up pins the published Bookworm base.
on:
  pull_request:
    branches:
      - 'master'

jobs:
  validate:
    name: Build and smoke-test Bookworm application image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Validate the next Debian base without publishing it
        run: |
          docker build --platform linux/amd64 \
            -f src/docker/Dockerfile-base -t archery-base:bookworm-ci .
          docker build --platform linux/amd64 \
            -f src/docker/Dockerfile \
            --build-arg BASE_IMAGE=archery-base:bookworm-ci \
            -t archery:bookworm-ci .
          docker run --rm --network none --entrypoint bash \
            -e EXPECTED_DEBIAN_CODENAME=bookworm \
            -e EXPECTED_PYTHON_VERSION=3.14 \
            -e SECRET_KEY=isolated-image-smoke-check-only-never-production \
            archery:bookworm-ci /opt/archery/src/docker/smoke-test.sh
