name: Publish Docker image

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'

jobs:
  push_to_registries:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            hhyo/archery
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker images
        id: build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: src/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the application image without network access
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network none --entrypoint bash \
            -e EXPECTED_DEBIAN_CODENAME=bullseye \
            -e EXPECTED_PYTHON_VERSION=3.11 \
            -e SECRET_KEY=isolated-image-smoke-check-only \
            "${{ steps.build.outputs.imageid }}" \
            /opt/archery/src/docker/smoke-test.sh

      - name: Validate the next Debian base without publishing it
        if: github.event_name == 'pull_request'
        run: |
          docker build --platform linux/amd64 \
            -f src/docker/Dockerfile-base -t archery-base:bookworm-ci .
          docker build --platform linux/amd64 \
            -f src/docker/Dockerfile \
            --build-arg BASE_IMAGE=archery-base:bookworm-ci \
            -t archery:bookworm-ci .
          docker run --rm --network none --entrypoint bash \
            -e EXPECTED_DEBIAN_CODENAME=bookworm \
            -e EXPECTED_PYTHON_VERSION=3.14 \
            -e SECRET_KEY=isolated-image-smoke-check-only \
            archery:bookworm-ci /opt/archery/src/docker/smoke-test.sh
