{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <!-- 自定义操作按钮-->
    <div id="toolbar" class="form-inline pull-left">
        <div class="form-group">
            <select id="navStatus" class="form-control selectpicker">
                <option value="" selected="selected">{% translate "状态" context "remaining pages" %}</option>
                {% for status, status_display in status_list %}
                    <option value="{{ status }}">{{ status_display }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <select id="instance_id" class="form-control selectpicker"
                    data-live-search="true">
                <option value="" selected="selected">{% translate "实例" context "remaining pages" %}</option>
                {% for ins in instance %}
                    <option value="{{ ins.id }}">{{ ins.instance_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <select id="group_id" class="form-control selectpicker"
                    data-live-search="true">
                <option value="" selected="selected">{% translate "组" context "remaining pages" %}</option>
                {% for rgp in resource_group %}
                    <option value="{{ rgp.group_id }}">{{ rgp.group_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <div id="reservation" class="form-control"
                 style="background: #fff; cursor: pointer; padding: 5px 10px; border: 1px solid #ccc; width: 100%">
                <i class="fa fa-calendar"></i>&nbsp;
                <span></span> <i class="fa fa-caret-down"></i>
            </div>
        </div>
    </div>
    <!-- 审核列表的表格-->
    <div class="table-responsive">
        <table id="sqlaudit-list" data-toggle="table" class="table table-striped table-hover"
               style="table-layout:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></table>
    </div>
    <!-- 日志信息-->
    <div class="modal fade" id="logs">
        <div class="modal-dialog">
            <div class="modal-content message_align">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                            aria-hidden="true">×</span></button>
                    <h4 class="modal-title text-danger">{% translate "工单日志" context "remaining pages" %}</h4>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table id="log-list" data-toggle="table" class="table table-striped table-hover"
                               style="table-layout:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
{% block js %}
    {% load static %}
    <link href="{% static 'daterangepicker/css/daterangepicker.css' %}" rel="stylesheet" type="text/css"/>
    <script src="{% static 'daterangepicker/js/moment.min.js' %}"></script>
    <script src="{% static 'daterangepicker/js/daterangepicker.js' %}"></script>
    <script src="{% static 'bootstrap-table/js/bootstrap-table-export.min.js' %}"></script>
    <script src="{% static 'bootstrap-table/js/tableExport.min.js' %}"></script>
    <script>
        // 初始化时间控件
        $(function () {
            let start = moment().subtract(29, 'days');
            let end = moment();

            function cb(start, end) {
                if (start.isValid() && end.isValid()) {
                    $('#reservation span').html(start.format('YYYY-MM-DD') + ' - ' + end.format('YYYY-MM-DD'));
                } else {
                    $('#reservation span').html('{% translate "全部数据" context "remaining pages" %}');
                }
            }

            $('#reservation').daterangepicker({
                startDate: start,
                endDate: end,
                showDropdowns: true,
                locale: {
                    format: "YYYY-MM-DD",// 显示格式
                    separator: " / ",// 两个日期之间的分割线
                    // 中文化
                    applyLabel: "{% translate "确定" context "remaining pages" %}",
                    cancelLabel: "{% translate "取消" context "remaining pages" %}",
                    fromLabel: "{% translate "开始" context "remaining pages" %}",
                    toLabel: "{% translate "结束" context "remaining pages" %}",
                    customRangeLabel: "{% translate "自定义" context "remaining pages" %}",
                    daysOfWeek: ["{% translate "日" context "remaining pages" %}", "{% translate "一" context "remaining pages" %}", "{% translate "二" context "remaining pages" %}", "{% translate "三" context "remaining pages" %}", "{% translate "四" context "remaining pages" %}", "{% translate "五" context "remaining pages" %}", "{% translate "六" context "remaining pages" %}"],
                    monthNames: ["{% translate "一月" context "remaining pages" %}", "{% translate "二月" context "remaining pages" %}", "{% translate "三月" context "remaining pages" %}", "{% translate "四月" context "remaining pages" %}", "{% translate "五月" context "remaining pages" %}", "{% translate "六" context "remaining pages" %}", "{% translate "七月" context "remaining pages" %}", "{% translate "八月" context "remaining pages" %}", "{% translate "九月" context "remaining pages" %}", "{% translate "十月" context "remaining pages" %}", "{% translate "十一月" context "remaining pages" %}", "{% translate "十二月" context "remaining pages" %}"],
                    firstDay: 1
                },
                ranges: {
                    "{% translate "全部" context "remaining pages" %}": [null, null],
                    "{% translate "今日" context "remaining pages" %}": [moment().startOf('day'), moment()],
                    "{% translate "昨日" context "remaining pages" %}": [moment().subtract('days', 1).startOf('day'), moment().subtract('days', 1).endOf('day')],
                    "{% translate "最近7日" context "remaining pages" %}": [moment().subtract('days', 6), moment()],
                    "{% translate "最近30日" context "remaining pages" %}": [moment().subtract('days', 29), moment()],
                    "{% translate "本月" context "remaining pages" %}": [moment().startOf("month"), moment().endOf("month")],
                    "{% translate "上个月" context "remaining pages" %}": [moment().subtract(1, "month").startOf("month"), moment().subtract(1, "month").endOf("month")]
                }
            }, cb).on('apply.daterangepicker', function (ev, picker) {
                get_workflow_list()
            });
            cb(start, end);
        });

    </script>
    <script>
        //获取SQL工单列表
        function get_workflow_list() {
            //采取异步请求
            //初始化table
            $('#sqlaudit-list').bootstrapTable('destroy').bootstrapTable({
                escape: true,
                method: 'post',
                url: "/api/v1/sql-workflows/audit-list/",
                ajax: function (params) {
                    $.ajax({
                        type: "POST",
                        url: "/api/v1/sql-workflows/audit-list/",
                        contentType: "application/json",
                        data: params.data,
                        success: params.success,
                        error: params.error
                    });
                },
                striped: true,                      //是否显示行间隔色
                cache: false,                       //是否使用缓存，默认为true，所以一般情况下需要设置一下这个属性（*）
                pagination: true,                   //是否显示分页（*）
                sortable: true,                     //是否启用排序
                sortOrder: "asc",                   //排序方式
                sidePagination: "server",           //分页方式：client客户端分页，server服务端分页（*）
                pageNumber: 1,                      //初始化加载第一页，默认第一页,并记录
                pageSize: 20,                     //每页的记录行数（*）
                pageList: [20, 30, 50, 100],       //可供选择的每页的行数（*）
                showExport: true,                   //是否显示导出按钮
                exportDataType: "all",
                exportOptions: {
                    fileName: "sqlworkflow_" + dateFormat("yyyyMMddhhmmss",new Date())
                },
                search: true,                      //是否显示表格搜索
                strictSearch: false,                //是否全匹配搜索
                showColumns: true,                  //是否显示所有的列（选择显示的列）
                showRefresh: true,                  //是否显示刷新按钮
                minimumCountColumns: 2,             //最少允许的列数
                clickToSelect: true,                //是否启用点击选中行
                uniqueId: "id",                     //每一行的唯一标识，一般为主键列
                showToggle: true,                   //是否显示详细视图和列表视图的切换按钮
                cardView: false,                    //是否显示详细视图
                detailView: false,                  //是否显示父子表
                locale: '{% if LANGUAGE_CODE == "en" %}en-US{% else %}zh-CN{% endif %}',                    //本地化
                toolbar: "#toolbar",               //指明自定义的toolbar
                queryParamsType: 'limit',
                //请求服务数据时所传参数
                queryParams:
                    function (params) {
                        let start_date = $("#reservation").data('daterangepicker').startDate;
                        let end_date = $("#reservation").data('daterangepicker').endDate;
                        const filterParams = {
                            limit: params.limit,
                            offset: params.offset,
                            navStatus: $("#navStatus").val(),
                            search: params.search
                        };
                        if (start_date && start_date.isValid() && end_date && end_date.isValid()) {
                            filterParams.start_date = start_date.format('YYYY-MM-DD');
                            filterParams.end_date = end_date.format('YYYY-MM-DD');
                        }
                        const instanceId = $("#instance_id").val();
                        const groupId = $("#group_id").val();
                        if (instanceId !== "" && instanceId !== null && instanceId !== undefined) {
                            filterParams.instance_id = Number(instanceId);
                        }
                        if (groupId !== "" && groupId !== null && groupId !== undefined) {
                            filterParams.group_id = Number(groupId);
                        }
                        return filterParams;
                    },
                columns: [{
                    title: '{% translate "工单名称" context "remaining pages" %}',
                    field: 'workflow_name',
                    formatter: function (value, row, index) {
                        var span = document.createElement('span');
                        span.setAttribute('title', value);
                        if (value.length > 20) {
                            span.innerHTML = "<a href=\"/detail/" + row.workflow_id + "/\">" + value.substr(0, 20) + '...';
                            +"</a>";
                        } else {
                            span.innerHTML = "<a href=\"/detail/" + row.workflow_id + "/\">" + value + "</a>";
                        }
                        return span.outerHTML;
                    }
                }, {
                    title: '{% translate "工单完整名称" context "remaining pages" %}',
                    field: 'workflow_name',
                    visible: false // 默认不显示
                }, {
                    title: '{% translate "类型" context "remaining pages" %}',
                    field: 'syntax_type',
                    formatter: function (value, row, index) {
                        if (String(value) === '0') {
                            return '{% translate "其他" context "remaining pages" %}'
                        } else if (String(value) === '1') {
                            return 'DDL'
                        } else if (String(value) === '2') {
                            return 'DML'
                        }
                    }
                }, {
                    title: '{% translate "发起人" context "remaining pages" %}',
                    field: 'engineer_display'
                }, {
                    title: '{% translate "工单状态" context "remaining pages" %}',
                    field: 'status',
                    formatter: function (value, row, index) {
                        return sqlworkflowStatus_formatter(value)
                    }
                }, {
                    title: '{% translate "备份" context "remaining pages" %}',
                    field: 'is_backup',
                    visible: true, // 默认显示
                    formatter: function (value, row, index) {
                        if (String(value) === 'true') {
                            return '{% translate "是" context "remaining pages" %}'
                        } else {
                            return '{% translate "否" context "remaining pages" %}'
                        }
                    }
                }, {
                    title: '{% translate "发起时间" context "remaining pages" %}',
                    field: 'create_time'
                }, {
                    title: '{% translate "目标实例" context "remaining pages" %}',
                    field: 'instance__instance_name'
                }, {
                    title: '{% translate "数据库" context "remaining pages" %}',
                    field: 'db_name'
                }, {
                    title: '{% translate "组" context "remaining pages" %}',
                    field: 'group_name'
                }, {
                    title: '{% translate "操作" context "remaining pages" %}',
                    field: 'operation',
                    formatter: function (value, row, index) {
                        return "<button class=\"btn btn-info btn-xs\" audit_id=\"" + row.audit_id + "\"\n" + "onclick=\"getLog(this)\" >{% translate "操作日志" context "remaining pages" %}\n" + "</button>"
                    }
                }],
                onLoadSuccess: function () {
                },
                onLoadError: onLoadErrorCallback,
                onSearch: function (e) {
                    //传搜索参数给服务器
                    queryParams(e)
                },
                responseHandler: function (res) {
                    //在ajax获取到数据，渲染表格之前，修改数据源
                    return res;
                }
            });

        }

        // 获取操作日志
        function getLog(obj) {
            var audit_id = $(obj).attr("audit_id");
            $.ajax({
                type: "get",
                url: "/api/v1/sql-workflows/" + audit_id + "/logs/",
                dataType: "json",
                complete: function () {
                },
                success: function (data) {
                    //初始化table
                    $('#logs').modal('show');
                    $('#log-list').bootstrapTable('destroy').bootstrapTable({
                        escape: true,
                        striped: true,                      //是否显示行间隔色
                        cache: false,                       //是否使用缓存，默认为true，所以一般情况下需要设置一下这个属性（*）
                        pagination: false,                   //是否显示分页（*）
                        sortable: false,                     //是否启用排序
                        sortOrder: "asc",                   //排序方式
                        sidePagination: "client",           //分页方式：client客户端分页，server服务端分页（*）
                        pageNumber: 1,                      //初始化加载第一页，默认第一页,并记录
                        pageSize: 20,                     //每页的记录行数（*）
                        pageList: [20, 30, 50, 100],       //可供选择的每页的行数（*）
                        search: false,                      //是否显示表格搜索
                        strictSearch: false,                //是否全匹配搜索
                        showColumns: false,                  //是否显示所有的列（选择显示的列）
                        showRefresh: false,                  //是否显示刷新按钮
                        minimumCountColumns: 2,             //最少允许的列数
                        clickToSelect: false,                //是否启用点击选中行
                        uniqueId: "id",                     //每一行的唯一标识，一般为主键列
                        showToggle: false,                   //是否显示详细视图和列表视图的切换按钮
                        cardView: false,                    //是否显示详细视图
                        detailView: false,                  //是否显示父子表
                        locale: '{% if LANGUAGE_CODE == "en" %}en-US{% else %}zh-CN{% endif %}',                    //本地化
                        data: data.rows,
                        columns: [{
                            title: '{% translate "操作" context "remaining pages" %}',
                            field: 'operation_type_desc'
                        }, {
                            title: '{% translate "操作人" context "remaining pages" %}',
                            field: 'operator_display'
                        }, {
                            title: '{% translate "操作时间" context "remaining pages" %}',
                            field: 'operation_time'
                        }, {
                            title: '{% translate "操作信息" context "remaining pages" %}',
                            field: 'operation_info'
                        }],
                        onLoadSuccess: function () {
                        },
                        onLoadError: onLoadErrorCallback,
                    });
                },
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    alert(errorThrown);
                }
            })
        }

        //筛选变动自动刷新
        $("#navStatus").change(function () {
            get_workflow_list();
        });

        $("#instance_id").change(function () {
            get_workflow_list();
        });

        $("#group_id").change(function () {
            get_workflow_list();
        });

        //初始化数据
        $(document).ready(function () {
            get_workflow_list();
        });
    </script>
{% endblock %}
