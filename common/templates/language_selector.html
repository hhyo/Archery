{% load i18n %}
{% get_current_language as current_language %}
{% get_available_languages as available_languages %}
<form action="{% url 'set_language' %}" method="post" class="form-inline" style="padding: 10px 15px;">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <label for="language-selector">{% translate "语言" %}</label>
    <select name="language" id="language-selector" class="form-control input-sm">
        {% for code, name in available_languages %}
            <option value="{{ code }}"{% if code == current_language %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn btn-default btn-sm">{% translate "切换" %}</button>
</form>
